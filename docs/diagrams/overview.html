<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hotmilk — 全体像</title>
<style>
  :root {
    --paper: #fbf7f2;
    --ink: #2b2620;
    --accent: #f0683a;
    --muted: #9a8f80;
    --line: #d8cdbf;
    --box: #ffffff;
    --box-edge: #e4dccf;
    --group-bg: #f4ede2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .diagram {
    background: var(--box);
    border: 1px solid var(--box-edge);
    border-radius: 14px;
    padding: 12px;
    max-width: 1080px;
  }
  .legend { display: flex; gap: 18px; margin-top: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<h1>hotmilk の全体像</h1>
<div class="sub">Pi 用のメタパッケージ。1 つのエントリーポイントから、<strong>ON になっているバンドル拡張だけ</strong>をたどりに渡す。</div>

<div class="diagram">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

    </marker>
  </defs>

  <g>

    <text x="540" y="46" text-anchor="middle" font-size="15" font-weight="700">🧑‍💻 pi-coding-agent</text>
    <text x="540" y="66" text-anchor="middle" font-size="12" fill="#8a7d6a">package.json → pi.extensions が 1 つだけ</text>
  </g>

  <!-- Pi → Entry 矢印 -->
  <line x1="540" y1="82" x2="540" y2="128" stroke="#b0a795" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="552" y="112" font-size="11" fill="#8a7d6a">ロード</text>

    <rect x="70" y="138" width="200" height="54" rx="9" fill="#fff" stroke="#e0b98a" stroke-width="1.4"/>
    <text x="170" y="162" text-anchor="middle" font-size="13" font-weight="700">📄 hotmilk.json</text>
    <text x="170" y="180" text-anchor="middle" font-size="11" fill="#8a7d6a">トグル設定・保存先</text>

    <text x="64</think>

    <text x="642" y="352" text-anchor="middle" font-size="11" fill="#4a6a90">vcc · context-view</text>

    <text x="667" y="486" text-anchor="middle" font-size="11" fill="#7d7660">pi-autoresearch</text>

  <text x="1040" y="542" text-anchor="end" font-size="11" fill="#b0a795">ON にした拡張だけ、入口から逐次・並列に渡される</text>
</svg>
</div>
