name: Test Tag-push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  release-tag:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: package_version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve latest release tag
        id: latest_release
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput("tag", release.data.tag_name ?? "");
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("tag", "");
                return;
              }
              throw error;
            }

      - name: Check whether tag push is needed
        id: compare
        env:
          PACKAGE_TAG: ${{ steps.package_version.outputs.version }}
          RELEASE_TAG: ${{ steps.latest_release.outputs.tag }}
        run: |
          if [ "$PACKAGE_TAG" = "$RELEASE_TAG" ]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "latest release tag matches package version: $PACKAGE_TAG"
          else
            echo "should_push=true" >> "$GITHUB_OUTPUT"
            echo "tag push needed: package=$PACKAGE_TAG latest_release=${RELEASE_TAG:-<none>}"
          fi

      - name: Push tag for publish workflow
        if: steps.compare.outputs.should_push == 'true'
        env:
          PACKAGE_TAG: ${{ steps.package_version.outputs.version }}
          TAG_PUSH_PAT: ${{ secrets.TAG_PUSH_PAT }}
        run: |
          if git ls-remote --tags origin "refs/tags/$PACKAGE_TAG" | grep -q "$PACKAGE_TAG"; then
            echo "tag already exists on origin: $PACKAGE_TAG"
            echo "If publish.yml did not run, the tag was likely pushed with GITHUB_TOKEN."
            echo "Re-push with TAG_PUSH_PAT or local credentials to trigger publish:"
            echo "  git push origin :refs/tags/$PACKAGE_TAG && git push origin $PACKAGE_TAG"
            exit 0
          fi
          if [ -z "$TAG_PUSH_PAT" ]; then
            echo "::error::TAG_PUSH_PAT secret is required — GITHUB_TOKEN tag pushes do not trigger publish.yml"
            echo "Add a fine-grained PAT (Contents: Read and write) as repository secret TAG_PUSH_PAT,"
            echo "or push manually: git tag $PACKAGE_TAG && git push origin $PACKAGE_TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$PACKAGE_TAG"
          git push "https://x-access-token:${TAG_PUSH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${PACKAGE_TAG}"
