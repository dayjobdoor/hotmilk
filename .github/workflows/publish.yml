name: CI

on:
  push:
    branches:
      - main
  # Emergency Pi-only release when omp-audit is blocked by omp or runner trouble; see docs/maintenance.md.
  workflow_dispatch:
    inputs:
      skip_omp_audit:
        description: Publish without the omp audit gate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  publish:
    needs: [test]
    # A skipped omp-audit (dispatch bypass) does not block; a failed one does.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Check whether npm publish is needed
        id: publish_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Exact-version check: latest-only compare can mis-skip or collide on re-runs.
          if npm view "hotmilk@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "npm already has hotmilk@$VERSION — skipping publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "will publish hotmilk@$VERSION (npm latest: $(npm view hotmilk version 2>/dev/null || echo none))"
          fi

      - run: bun install --frozen-lockfile
        if: steps.publish_check.outputs.publish == 'true'

      # Rely on the `test` and `omp-audit` jobs (`needs`) for lint/test/audit; pack only here.
      - name: Pack dry-run
        if: steps.publish_check.outputs.publish == 'true'
        run: npm pack --dry-run

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.publish_check.outputs.publish == 'true'
        with:
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        if: steps.publish_check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ensure git release tag
        if: |
          steps.publish_check.outputs.publish == 'false' || success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! npm view "hotmilk@$VERSION" version >/dev/null 2>&1; then
            echo "npm does not have hotmilk@$VERSION yet — skipping tag"
            exit 0
          fi

          # Prefer the version-bump commit on this branch (commit message "vX.Y.Z").
          TAG_COMMIT=$(git log --format=%H --grep="^v${VERSION}$" -n 1 HEAD || true)
          if [ -z "$TAG_COMMIT" ]; then
            TAG_COMMIT="$GITHUB_SHA"
          fi

          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [ "$REMOTE_SHA" = "$TAG_COMMIT" ]; then
            echo "Tag $TAG already points to $TAG_COMMIT on origin"
            exit 0
          fi

          if [ -n "$REMOTE_SHA" ]; then
            echo "::warning::Moving tag $TAG from $REMOTE_SHA to $TAG_COMMIT"
            git push origin ":refs/tags/$TAG"
          fi

          git tag -fa "$TAG" "$TAG_COMMIT" -m "hotmilk $TAG"
          git push origin "refs/tags/${TAG}"
