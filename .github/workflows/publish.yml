name: Publish Package

on:
  push:
    tags:
      - "[v]?[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Trusted Publishing (OIDC): do not set NODE_AUTH_TOKEN / NPM_TOKEN here.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Install/test without registry auth (avoids confusing npm before OIDC exchange).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci --legacy-peer-deps
      - run: npm run test

      # OIDC → npm token exchange for Trusted Publishing (registry-url only on publish steps).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm identity (Trusted Publishing)
        run: |
          npm whoami
          npm config get registry

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
