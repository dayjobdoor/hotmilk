name: Publish Package

# Trusted Publishing validates the tag-push workflow context.
# Do not add workflow_dispatch — manual runs often get E404 after provenance.
# https://docs.npmjs.com/trusted-publishers#github-actions
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm with provenance
        run: |
          npm ci --legacy-peer-deps
          echo "Publishing with provenance..."
          npm publish --provenance --access public
