name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Check whether npm publish is needed
        id: should_publish
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          # Exact-version check: latest-only compare can mis-skip or collide on re-runs.
          if npm view "hotmilk@$LOCAL" version >/dev/null 2>&1; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "npm already has hotmilk@$LOCAL — skipping publish"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
            echo "will publish hotmilk@$LOCAL (npm latest: $(npm view hotmilk version 2>/dev/null || echo none))"
          fi

      - run: bun install --frozen-lockfile
        if: steps.should_publish.outputs.need == 'true'

      # Rely on the `test` job (`needs: test`) for lint/test; pack only here.
      - name: Pack dry-run
        if: steps.should_publish.outputs.need == 'true'
        run: npm pack --dry-run

      - uses: actions/setup-node@v7
        if: steps.should_publish.outputs.need == 'true'
        with:
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        if: steps.should_publish.outputs.need == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push git tag after publish
        if: steps.should_publish.outputs.need == 'true'
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin — refusing to move it"
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"
