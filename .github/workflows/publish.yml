name: Publish Package

on:
  push:
    tags:
      - "[v]?[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Trusted Publishing (OIDC): no NPM_TOKEN / NODE_AUTH_TOKEN in this workflow.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run test

      # Trusted Publishing: setup-node wires OIDC into npm for this step only.
      # Use npm directly (not bun/bunx publish) so registry auth is picked up.
      - name: Verify npm OIDC identity
        run: npm whoami
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
