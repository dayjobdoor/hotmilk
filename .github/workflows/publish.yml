name: Publish Package

on:
  push:
    tags:
      - "[v]?[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Trusted Publishing (OIDC): no NPM_TOKEN / NODE_AUTH_TOKEN in this workflow.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run test

      # bun publish does not use GitHub OIDC; npm CLI + --provenance does.
      - run: bunx npm publish --provenance --access public
