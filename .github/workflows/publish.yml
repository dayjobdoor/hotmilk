name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Check whether npm publish is needed
        id: should_publish
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          # Exact-version check: latest-only compare can mis-skip or collide on re-runs.
          if npm view "hotmilk@$LOCAL" version >/dev/null 2>&1; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "npm already has hotmilk@$LOCAL — skipping publish"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
            echo "will publish hotmilk@$LOCAL (npm latest: $(npm view hotmilk version 2>/dev/null || echo none))"
          fi

      - run: bun install --frozen-lockfile
        if: steps.should_publish.outputs.need == 'true'

      # Rely on the `test` job (`needs: test`) for lint/test; pack only here.
      - name: Pack dry-run
        if: steps.should_publish.outputs.need == 'true'
        run: npm pack --dry-run

      - uses: actions/setup-node@v7
        if: steps.should_publish.outputs.need == 'true'
        with:
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        if: steps.should_publish.outputs.need == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ensure git release tag
        if: |
          steps.should_publish.outputs.need == 'false' ||
          (steps.should_publish.outputs.need == 'true' && success())
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! npm view "hotmilk@$VERSION" version >/dev/null 2>&1; then
            echo "npm does not have hotmilk@$VERSION yet — skipping tag"
            exit 0
          fi

          # Prefer the version-bump commit on this branch (commit message "vX.Y.Z").
          TAG_COMMIT=$(git log --format=%H --grep="^v${VERSION}$" -n 1 HEAD || true)
          if [ -z "$TAG_COMMIT" ]; then
            TAG_COMMIT="$GITHUB_SHA"
          fi

          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          if [ "$REMOTE_SHA" = "$TAG_COMMIT" ]; then
            echo "Tag $TAG already points to $TAG_COMMIT on origin"
            exit 0
          fi

          if [ -n "$REMOTE_SHA" ]; then
            echo "::warning::Moving tag $TAG from $REMOTE_SHA to $TAG_COMMIT"
            git push origin ":refs/tags/$TAG"
          fi

          git tag -fa "$TAG" "$TAG_COMMIT" -m "hotmilk $TAG"
          git push origin "refs/tags/${TAG}"
