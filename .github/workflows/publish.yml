name: Publish Package

on:
  push:
    tags:
      - "[v]?[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Trusted Publishing (OIDC): no NPM_TOKEN / NODE_AUTH_TOKEN in this workflow.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci --legacy-peer-deps
      - run: npm run test

      # Trusted Publishing: setup-node wires OIDC into npm for this step only.
      - name: Publish to npm with provenance
        run: npm publish --provenance
